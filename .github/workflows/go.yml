name: Go validation
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve and normalize module dependencies
        run: go mod tidy
      - name: Go tests
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Preserve dependency receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-dependency-receipts
          path: |
            go.mod
            go.sum
