name: Go validation
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify module receipts
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Go tests
        run: go test ./...
      - name: Go vet
        run: go vet ./...
